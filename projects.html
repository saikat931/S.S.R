<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>All Projects — Saikat Sasmal</title>
<meta name="description" content="All projects and works by Saikat Sasmal."/>
<meta name="robots" content="index, follow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="assets/css/main.css"/>
<link rel="stylesheet" href="assets/css/portfolio.css"/>
<script src="assets/js/theme.js"></script>
</head>
<body>

<div id="page-loader" aria-hidden="true">
  <div class="loader-logo"><img src="assets/images/logo.png" alt="S.S.R Logo" style="height: 120px; width: auto;" /></div>
  <div class="loader-bar"></div>
</div>

<div id="toast-container" role="status" aria-live="polite"></div>

<!-- Navbar -->
<header id="navbar" role="banner" class="scrolled">
  <div class="container nav-inner">
    <a href="index.html" class="nav-logo" aria-label="S.S.R — Home"><img src="assets/images/logo.png" alt="S.S.R Logo" style="height: 70px; width: auto;" /></a>
    <nav class="nav-links" aria-label="Main navigation">
      <a href="index.html#about"      class="nav-link">About</a>
      <a href="index.html#skills"     class="nav-link">Skills</a>
      <a href="index.html#projects"   class="nav-link active">Projects</a>
      <a href="index.html#experience" class="nav-link">Experience</a>
      <a href="index.html#contact"    class="nav-link">Contact</a>
    </nav>
    <div class="nav-actions">
      <button class="theme-toggle" data-theme-toggle data-theme-icon aria-label="Toggle theme">☀️</button>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>

<div class="mobile-menu" id="mobile-menu">
  <a href="index.html#about" class="mobile-link">About</a>
  <a href="index.html#skills" class="mobile-link">Skills</a>
  <a href="index.html#projects" class="mobile-link active">Projects</a>
  <a href="index.html#experience" class="mobile-link">Experience</a>
  <a href="index.html#contact" class="mobile-link">Contact</a>
</div>

<!-- Main Content -->
<main role="main" style="padding-top: 120px; padding-bottom: 80px; min-height: 100vh;">
  <section id="projects" class="section" style="padding-top: 0;">
    <div class="container">
      <div class="section-card-wrap">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 3rem; flex-wrap: wrap; gap: 2rem;">
          <div>
            <div style="font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent); letter-spacing: 0.2em; margin-bottom: 0.5rem; text-transform: uppercase;">▶ PORTFOLIO</div>
            <h2 style="font-family: var(--font-head); font-size: 2.5rem; color: var(--text-primary); margin: 0;">All Projects</h2>
          </div>
          
          <div style="flex: 1; display: flex; justify-content: center;">
             <div id="cat-filter" style="display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center;"></div>
          </div>
          
          <div>
             <a href="index.html#projects" style="color: var(--text-primary); font-size: 0.85rem; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; border: 1px solid var(--border); border-radius: 20px; transition: background 0.3s;" onmouseover="this.style.background='var(--bg-glass)'" onmouseout="this.style.background='transparent'">➔ Back to Home</a>
          </div>
        </div>
        
        <div class="projects-grid" id="projects-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem;">
          <!-- JS will populate -->
        </div>
      </div>
    </div>
  </section>
</main>

<!-- Footer -->
<footer style="background: var(--bg-card); padding: 2rem 0; border-top: 1px solid var(--border); text-align: center; color: var(--text-secondary); font-size: 0.9rem;">
  <div class="container" style="display: flex; flex-direction: column; align-items: center; gap: 1rem;">
    <div style="font-size: 1.5rem; color: var(--text-primary); font-family: var(--font-head); font-weight: bold;">
      <img src="assets/images/logo.png" alt="S.S.R Logo" style="height: 40px; width: auto;" />
    </div>
    <div id="footer-copy">© 2025 Saikat Sasmal. All rights reserved.</div>
    <div>Designed & Developed by Saikat Sasmal ❤</div>
  </div>
</footer>

<button id="back-top" aria-label="Back to top" onclick="window.scrollTo({top:0,behavior:'smooth'})">▲</button>

<script src="assets/js/data.js"></script>
<script src="assets/js/portfolio.js"></script>
</body>
</html>
